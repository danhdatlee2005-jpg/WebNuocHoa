version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_db
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-dbs.sql:/docker-entrypoint-initdb.d/init-dbs.sql
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq_broker
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running || exit 0"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  kong:
    image: kong:latest
    container_name: kong_gateway
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      # Fix stale DNS: re-resolve DNS mỗi 5 giây thay vì cache IP mãi
      KONG_DNS_ORDER: "LAST,SRV,A,CNAME"
      KONG_UPSTREAM_KEEPALIVE_POOL_SIZE: 100
      KONG_UPSTREAM_KEEPALIVE_MAX_REQUESTS: 1000
      KONG_UPSTREAM_KEEPALIVE_IDLE_TIMEOUT: 60
      # Tăng timeout để chờ backend đang khởi động
      KONG_UPSTREAM_CONNECT_TIMEOUT: 10000
      KONG_UPSTREAM_SEND_TIMEOUT: 30000
      KONG_UPSTREAM_READ_TIMEOUT: 30000
    ports:
      - "8000:8000"
    volumes:
      - ./kong/kong.yml:/usr/local/kong/declarative/kong.yml
    networks:
      - ecommerce-network
    depends_on:
      - auth-service
      - user-service
      - product-service
      - order-service

  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    container_name: auth-service
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_RABBITMQ_HOST=rabbitmq
      - JAVA_TOOL_OPTIONS=-XX:+UseG1GC -Xms128m -Xmx384m
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network

  user-service:
