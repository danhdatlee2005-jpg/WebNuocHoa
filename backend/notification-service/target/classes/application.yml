server:
  port: 8092

spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

ecommerce:
  rabbitmq:
    exchange: ecommerce.topic.exchange
    queues:
      notification-events-queue: ecommerce.notification.events.queue
    routing-keys:
      order-created: order.created
      shipment-updated: shipment.updated
