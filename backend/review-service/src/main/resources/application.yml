server:
  port: 8091

spring:
  application:
    name: review-service
  datasource:
    url: jdbc:postgresql://localhost:5432/review_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

ecommerce:
  rabbitmq:
    exchange: ecommerce.topic.exchange
    routing-keys:
      review-created: review.created
